# Builds the ADERA whitepaper into a GitHub Pages site plus a downloadable PDF.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# After that, every push to main that touches the whitepaper republishes both.
name: Publish whitepaper

on:
  push:
    branches: [main]
    paths:
      - 'docs/01-ADERA-Whitepaper.md'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/docs/package-lock.json

      - name: Install build dependencies
        working-directory: tools/docs
        run: npm ci

      - name: Build site and PDF
        working-directory: tools/docs
        run: npm run build

      - name: Upload PDF as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADERA-Whitepaper-pdf
          path: _site/ADERA-Whitepaper.pdf
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
